[project]
name = "vecstore"
version = "0.1.0"
description = "Tiny reusable local semantic search on SQLite + sqlite-vec, with a pluggable local embedder."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Matthew Dickson" }]
dependencies = ["sqlite-vec>=0.1.6"]

[project.optional-dependencies]
# Default local embedder. Install with: pip install "vecstore[fastembed]"
fastembed = ["fastembed>=0.4.0"]
# MCP stdio server (`python ask.py --db X serve-mcp`): pip install "vecstore[mcp]"
mcp = ["fastmcp"]
# Golden-set eval harness (`python evals/run_golden.py`): pip install "vecstore[evals]"
evals = ["pyyaml>=6"]
dev = ["pytest>=8.0", "fastembed>=0.4.0", "pyyaml>=6"]

[project.scripts]
vecstore = "vecstore:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["vecstore", "ask"]
