[project]
name = "vecstore"
version = "0.1.0"
description = "Tiny reusable local semantic search on SQLite + sqlite-vec, with a pluggable local embedder."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Matthew Dickson" }]
dependencies = ["sqlite-vec>=0.1.6"]

[project.optional-dependencies]
# Default local embedder. Install with: pip install "vecstore[fastembed]"
fastembed = ["fastembed>=0.4.0"]
dev = ["pytest>=8.0", "fastembed>=0.4.0"]

[project.scripts]
vecstore = "vecstore:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["vecstore"]
